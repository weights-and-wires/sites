# Checks every pull request: vet, unit tests, a full build (KaTeX, the paper
# graph, and concept links), an internal link check, and the paper exercises.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .cache/pyodide
          key: pyodide-${{ hashFiles('scripts/fetch-pyodide.sh') }}
      - name: Fetch Pyodide
        run: sh scripts/fetch-pyodide.sh
      - run: go vet ./...
      - run: go test ./...
      - name: Build both sites, check the graph, KaTeX, and links
        run: go run ./cmd/build -check -release
      - name: Build the server binary
        run: CGO_ENABLED=0 go build -o /tmp/serve ./cmd/serve

  exercises:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements-exercises.txt
      - name: Install NumPy and CPU PyTorch
        run: python -m pip install -r scripts/requirements-exercises.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Check every exercise (starter fails, solution passes, both fast)
        run: python scripts/check_exercises.py --require-torch
      - name: Check course lesson links (skipped without COURSES_READ_TOKEN)
        env:
          COURSES_READ_TOKEN: ${{ secrets.COURSES_READ_TOKEN }}
        run: python scripts/check_course_links.py
