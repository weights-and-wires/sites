# Checks every pull request: vet, unit tests, a full build with KaTeX, and an
# internal link check.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: go vet ./...
      - run: go test ./...
      - name: Build both sites and check links
        run: go run ./cmd/build -check
      - name: Build the server binary
        run: CGO_ENABLED=0 go build -o /tmp/serve ./cmd/serve
