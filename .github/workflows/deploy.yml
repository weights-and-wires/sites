# Builds the container image on every push to main, pushes it to GHCR,
# then asks the VM to pull and restart. The VM never builds from source.
name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/weights-and-wires/sites

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Pull and restart on the VM
        env:
          VM_DEPLOY_KEY: ${{ secrets.VM_DEPLOY_KEY }}
        run: |
          if [ -z "$VM_DEPLOY_KEY" ]; then
            echo "::error::VM_DEPLOY_KEY is not set. Add the deploy key as a repository secret."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo 'vm.ifkash.dev ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPDOLRx5CzaOgMkcL5a26pT3t6RA95WMT5lglB5f0Z1I' > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key ifkash@vm.ifkash.dev "deploy sites"
