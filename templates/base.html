{{define "base"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f6f0">
<title>{{.Title}}</title>
<meta name="description" content="{{.Description}}">
<link rel="icon" href="/assets/{{.Assets.Favicon}}" type="image/svg+xml">
<script src="/assets/{{.Assets.ThemeJS}}"></script>
<link rel="stylesheet" href="/assets/{{.Assets.CSS}}">
{{if .Math}}<link rel="stylesheet" href="/assets/katex/katex.min.css">{{end}}
</head>
<body class="site-{{.Site.ID}}"{{if .Assets.WorkerJS}} data-worker-url="/assets/{{.Assets.WorkerJS}}" data-harness-url="/assets/{{.Assets.Harness}}"{{end}}>
<a class="skip-link" href="#main">Skip to content</a>
<header class="topbar">
  <a class="brand" href="/" aria-label="{{.Site.Name}} home">
    <svg class="brand-mark" viewBox="0 0 38 38" aria-hidden="true"><rect width="38" height="38" rx="8" fill="currentColor"/><path d="M11 26V12h6.5a4.5 4.5 0 0 1 0 9H11" fill="none" stroke="var(--paper)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="22" width="5" height="5" rx="1" fill="var(--accent)"/></svg>
    <span class="brand-type"><span class="brand-name">{{.Site.Wordmark}}<span class="brand-slash"> /</span></span><span class="brand-subtitle">{{.Site.Subtitle}}</span></span>
  </a>
  <nav class="topbar-nav" aria-label="Sites">
    <a href="https://courses.ifkash.dev/"{{if eq .Site.ID "courses"}} aria-current="page"{{end}}>Courses</a>
    <a href="https://papers.ifkash.dev/"{{if eq .Site.ID "papers"}} aria-current="page"{{end}}>Papers</a>
  </nav>
  <button class="icon-button" type="button" data-theme-toggle aria-label="Switch theme">
    <svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
    <svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>
<main id="main" tabindex="-1">
{{template "page" .}}
</main>
<footer class="site-footer">
  <span class="meta">{{.Site.Name}} · built {{.Built}}</span>
</footer>
{{block "scripts" .}}{{end}}
</body>
</html>
{{end}}
