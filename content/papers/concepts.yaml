# Background concepts for the paper pages. Each concept maps to the course
# lesson that teaches it. Every URL was taken from the course repos' lesson
# front matter on origin/main (never guessed). anchor_match is "close" when
# no lesson teaches the concept directly and the URL points at the nearest one.
# The build fails if a paper lists a concept that is missing here.
concepts:
  sgd:
    label: "SGD"
    url: "https://ml.ifkash.dev/lessons/031-sgd-adam-and-schedules"
    lesson: "SGD, Adam, and learning-rate schedules"
    anchor_match: exact
    refresher: "Step against the gradient of a loss estimated on a small random batch."
  momentum:
    label: "momentum"
    url: "https://ml.ifkash.dev/lessons/005-gradient-descent-and-momentum"
    lesson: "Gradient descent, step size, and momentum"
    anchor_match: exact
    refresher: "Keep a running average of past gradients so steps build speed along consistent directions and damp oscillation."
  exponential-moving-averages:
    label: "exponential moving averages"
    url: "https://ml.ifkash.dev/lessons/031-sgd-adam-and-schedules"
    lesson: "SGD, Adam, and learning-rate schedules"
    anchor_match: exact
    refresher: "A running average that weights recent values most, updated as new = beta * old + (1 - beta) * latest."
  l2-regularization:
    label: "L2 regularization"
    url: "https://ml.ifkash.dev/lessons/006-ridge-regression"
    lesson: "Ridge regression: a fee on large weights, for every lambda"
    anchor_match: exact
    refresher: "Add the sum of squared weights, scaled by a coefficient, to the loss to discourage large weights."
  weight-decay:
    label: "weight decay"
    url: "https://ml.ifkash.dev/lessons/034-weight-decay-and-early-stopping"
    lesson: "Weight decay and early stopping: two ways to keep weights small"
    anchor_match: exact
    refresher: "Shrink every weight slightly toward zero at each update to keep weights small."
  backprop:
    label: "backprop"
    url: "https://ml.ifkash.dev/lessons/029-backpropagation"
    lesson: "Backpropagation"
    anchor_match: exact
    refresher: "Apply the chain rule backward through a network to get the gradient of the loss for every parameter."
  mean-and-variance:
    label: "mean and variance"
    url: "https://ml.ifkash.dev/lessons/033-normalisation-layers"
    lesson: "Normalisation layers: batch norm, layer norm, and their gradients"
    anchor_match: close
    refresher: "The average of a set of values, and the average squared distance of those values from that average."
  batch-statistics:
    label: "batch statistics"
    url: "https://ml.ifkash.dev/lessons/033-normalisation-layers"
    lesson: "Normalisation layers: batch norm, layer norm, and their gradients"
    anchor_match: exact
    refresher: "The mean and variance computed over the examples in the current mini-batch, used to normalize activations."
  ieee-754-floating-point:
    label: "IEEE 754 floating point"
    url: "https://gpu.ifkash.dev/c/09-floating-point-on-the-gpu"
    lesson: "Floating point on the GPU"
    anchor_match: exact
    refresher: "The standard binary format that stores a number as a sign, an exponent, and a mantissa with finite precision."
  underflow-and-overflow:
    label: "underflow and overflow"
    url: "https://gpu.ifkash.dev/c/09-floating-point-on-the-gpu"
    lesson: "Floating point on the GPU"
    anchor_match: exact
    refresher: "Underflow rounds a tiny value to zero, and overflow pushes a huge value past the format's maximum to infinity."
  svd:
    label: "SVD"
    url: "https://ml.ifkash.dev/lessons/004-stable-least-squares"
    lesson: "Lost digits, and how QR and the SVD keep them"
    anchor_match: exact
    refresher: "Factor a matrix into rotations and non-negative singular values that show how it stretches each direction."
  spectral-norm:
    label: "spectral norm"
    url: "https://ml.ifkash.dev/lessons/025-power-iteration-and-probabilistic-pca"
    lesson: "Power iteration and probabilistic PCA"
    anchor_match: close
    refresher: "The largest singular value of a matrix, which is the most it can stretch any unit vector."
  newton-schulz-iteration:
    label: "Newton-Schulz iteration"
    url: "https://ml.ifkash.dev/lessons/004-stable-least-squares"
    lesson: "Lost digits, and how QR and the SVD keep them"
    anchor_match: close
    refresher: "A matrix-multiplication-only iteration that pushes a matrix's singular values toward one, approximating its orthogonal factor."
  low-rank-factorization:
    label: "low-rank factorization"
    url: "https://ml.ifkash.dev/lessons/057-fine-tuning-and-lora"
    lesson: "Fine-tuning on a budget with LoRA"
    anchor_match: exact
    refresher: "Approximate a large matrix as the product of two thin matrices, which cuts parameters and compute."
  fine-tuning:
    label: "fine-tuning"
    url: "https://ml.ifkash.dev/lessons/057-fine-tuning-and-lora"
    lesson: "Fine-tuning on a budget with LoRA"
    anchor_match: exact
    refresher: "Continue training a pretrained model on a smaller task-specific dataset to adapt its behavior."
  matrix-rank:
    label: "matrix rank"
    url: "https://ml.ifkash.dev/lessons/004-stable-least-squares"
    lesson: "Lost digits, and how QR and the SVD keep them"
    anchor_match: close
    refresher: "The number of linearly independent columns of a matrix, or equivalently its count of non-zero singular values."
  backprop-through-time:
    label: "backprop through time"
    url: "https://ml.ifkash.dev/lessons/041-recurrent-cells-and-bptt"
    lesson: "Recurrent cells and backpropagation through time"
    anchor_match: exact
    refresher: "Unroll a recurrent network across time steps and backpropagate through the unrolled graph, summing gradients for shared weights."
  vanishing-gradients:
    label: "vanishing gradients"
    url: "https://ml.ifkash.dev/lessons/042-vanishing-gradients-and-clipping"
    lesson: "Vanishing gradients, exploding gradients, and clipping"
    anchor_match: exact
    refresher: "Gradients shrink as they pass back through many layers or steps, so early layers barely learn."
  cross-entropy:
    label: "cross-entropy"
    url: "https://ml.ifkash.dev/lessons/030-softmax-and-whole-network-gradients"
    lesson: "Softmax and whole-network gradients"
    anchor_match: exact
    refresher: "A loss that measures how much probability a model assigns to the true class, computed as the negative log of that probability."
  teacher-forcing:
    label: "teacher forcing"
    url: "https://ml.ifkash.dev/lessons/052-next-token-loss-and-safe-steps"
    lesson: "Training a language model: next-token loss, schedules, and clipping"
    anchor_match: exact
    refresher: "Train a sequence model by feeding it the true previous tokens instead of its own predictions."
  beam-search:
    label: "beam search"
    url: "https://speech.ifkash.dev/lessons/030-decoding-ctc"
    lesson: "Decoding CTC"
    anchor_match: exact
    refresher: "Decode by keeping the k highest-scoring partial sequences at each step instead of only the single best."
  softmax:
    label: "softmax"
    url: "https://ml.ifkash.dev/lessons/030-softmax-and-whole-network-gradients"
    lesson: "Softmax and whole-network gradients"
    anchor_match: exact
    refresher: "Turn a vector of scores into probabilities by exponentiating each and dividing by the sum."
  alignment:
    label: "alignment"
    url: "https://ml.ifkash.dev/lessons/046-attention-gradients-and-alignment"
    lesson: "Attention gradients and the alignment matrix"
    anchor_match: exact
    refresher: "A matrix of weights showing which input positions each output position attends to."
  weighted-average:
    label: "weighted average"
    url: "https://ml.ifkash.dev/lessons/045-attention-as-soft-lookup"
    lesson: "Attention as a soft lookup, with a dot product or a learned scorer"
    anchor_match: exact
    refresher: "Combine values by multiplying each by a weight and summing, with weights that add up to one."
  matrix-multiplication:
    label: "matrix multiplication"
    url: "https://gpu.ifkash.dev/c/10-gemm-from-scratch"
    lesson: "GEMM from scratch"
    anchor_match: exact
    refresher: "Each output entry is the dot product of a row of one matrix with a column of the other."
  softmax-numerics:
    label: "softmax numerics"
